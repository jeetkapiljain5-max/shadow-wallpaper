<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&display=block" rel="stylesheet">
<style>
  @font-face{font-family:'SF Clock';src:url('fonts/SFClock.ttf') format('truetype');font-weight:100 900;font-display:block}
  html,body{margin:0;height:100%;overflow:hidden;background:#111;cursor:default;user-select:none}
  html.overlay,html.overlay body{background:transparent}
  html.overlay #c,html.overlay #date,html.overlay #dock,html.overlay #mdock,html.overlay #np,html.overlay #lyr{display:none!important}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #date{position:fixed;left:0;right:0;top:9.4vh;transform:translateY(-50%);text-align:center;
        font:600 2.75vh/1 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;letter-spacing:.01em;
        color:#fff;text-shadow:0 .15vh .9vh rgba(0,0,0,.22);transition:opacity .25s ease}
  .lg{position:relative;isolation:isolate;color:#fff;
       background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.07));
       backdrop-filter:blur(26px) saturate(170%) brightness(1.08);-webkit-backdrop-filter:blur(26px) saturate(170%) brightness(1.08);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.14),
                  0 1.6vh 4.5vh rgba(0,0,0,.22),0 .3vh .8vh rgba(0,0,0,.12);
       font-family:"SF Pro Text","SF Pro","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
  .lg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
       background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.38),rgba(255,255,255,0) 55%),
                  linear-gradient(115deg,rgba(255,255,255,0) 45%,rgba(255,255,255,.10) 60%,rgba(255,255,255,0) 72%)}
  body.music #dock{opacity:0 !important;pointer-events:none !important;visibility:hidden}
  #mdock{position:fixed;left:0;right:0;bottom:8.5vh;display:flex;justify-content:center;align-items:center;gap:2.6vh;z-index:7;pointer-events:none;visibility:hidden;
       opacity:0;transform:translateY(1.2vh);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.25,1)}
  body.music #mdock{visibility:visible;opacity:1;pointer-events:auto;transform:none}   /* music on: the controls stay */
  body.npsolo #mdock{bottom:auto;top:var(--npEnd,80vh)}          /* cover or video alone: controls right under it */
  body.npsolo.npvideo #mdock{opacity:1;pointer-events:auto;transform:none}   /* a video with no lyrics: the controls stay */
  #mdock{transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.25,1),top .8s cubic-bezier(.2,.9,.25,1)}
  #mdock.open{pointer-events:auto;opacity:1;transform:none}
  #mdock button{all:unset;cursor:pointer;display:grid;place-items:center;width:6.4vh;height:6.4vh;border-radius:50%;color:#fff;
       transition:background-color .2s ease,transform .25s cubic-bezier(.2,.9,.25,1)}
  #mdock button:hover{background:none;opacity:.85}
  #mdock svg path{stroke:currentColor;stroke-width:.6;stroke-linejoin:round}      /* the soft corners of Apple's symbols */
  #mdock button[data-k=prev] svg,#mdock button[data-k=next] svg{width:3.6vh;height:3.6vh}
  #mdock button:active{transform:scale(.9)}
  #mdock svg{width:3vh;height:3vh;fill:currentColor;filter:drop-shadow(0 .2vh .8vh rgba(0,0,0,.45))}
  #mdock .mid{width:7.6vh;height:7.6vh}
  #mdock .mid svg{width:4.2vh;height:4.2vh}
  #mdock .mid .pz{display:none}
  #mdock .mid.playing .pl{display:none}
  #mdock .mid.playing .pz{display:block}
  body.music #date{opacity:0 !important}
  #dock{position:fixed;left:50%;bottom:9vh;transform:translateX(-50%);display:flex;gap:4.2vh;z-index:3;pointer-events:none}
  #dock.open{pointer-events:auto}
  .app{position:relative;border:0;padding:0;margin:0;background:none;outline:none;cursor:pointer;width:7.6vh;height:7.6vh;
       transform:translateY(2.2vh) scale(.9);transition:transform .6s cubic-bezier(.2,.9,.25,1)}
  /* fade each layer, never the whole icon: a fading parent would switch off the frosted glass until the fade ends */
  .app > *{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transition:opacity .4s ease}

  #dock.open .app{transform:none}
  #dock.open .app > *{opacity:1}
  #dock.open .app:hover{transform:translateY(-.7vh) scale(1.07)}
  #dock.open .app:active{transform:translateY(-.2vh) scale(.93);transition-duration:.12s}
  .app .sh{fill:#000;fill-opacity:.3;filter:blur(.7vh)}
  .app .glassy{-webkit-mask-size:100% 100%;mask-size:100% 100%;background:rgba(255,255,255,.08);
       backdrop-filter:blur(14px) brightness(1.2) saturate(150%);-webkit-backdrop-filter:blur(14px) brightness(1.2) saturate(150%)}
  .app .wall,.app .face,.app .edge{shape-rendering:geometricPrecision}
  body.liquidDock .app .wall,body.liquidDock .app .edge,body.liquidDock .app .glassy,body.liquidDock .app .sh{visibility:hidden}
  body.liquidDock .app .face{visibility:hidden}

  /* the Windows button: hidden in Launchpad's bottom-right corner, it shows while the pointer is there.
     Windows blue = the Windows key is Windows' own; click it and it turns soft black = the Windows key opens Launchpad */
  #lpWinZone{position:absolute;right:0;bottom:0;width:17vh;height:15vh;z-index:6}
  body > #lpWinZone,html.overlay #lpWinZone{display:none}
  #lpWin{position:absolute;right:4vh;bottom:3.6vh;width:4.4vh;height:4.4vh;border:0;padding:0;margin:0;background:none;outline:none;cursor:pointer;
       opacity:0;transform:scale(.8) translateY(.6vh);transition:opacity .3s ease,transform .45s cubic-bezier(.2,.9,.25,1)}
  #lpWinZone:hover #lpWin,#lpWin:focus-visible{opacity:1;transform:none}
  #lpWinZone:hover #lpWin:hover{transform:scale(1.07)}
  #lpWinZone:hover #lpWin:active{transform:scale(.93);transition-duration:.12s}
  #lpWin svg,#lpWin .gls,#lpWin .gls > *{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  /* on: a soft black logo */
  #lpWin .blue{transition:opacity .6s ease}
  #lpWin.on .blue{opacity:0}
  #lpWin .gls > *{opacity:0;transition:opacity .6s ease}
  #lpWin.on .gls > *{opacity:1}
  /* turning it on: a glint runs across the glass */
  #lpWin .shine{-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%) no-repeat;
       background-size:300% 100%;background-position:100% 0}
  #lpWin.on .shine{opacity:0}
  #lpWin.glint .shine{opacity:1;animation:winGlint .9s cubic-bezier(.4,0,.2,1) .15s both}
  @keyframes winGlint{from{background-position:100% 0}to{background-position:0 0;opacity:0}}
</style>
</head>
